name: Rebuild review-branch Go artifacts

# Temporary review-branch workflow: a maintainer-only, branch-scoped
# source-to-binary refresh, never executed for forked pull requests.
on:
  push:
    branches:
      - fix/apadana-full-ci-hardening-20261014
    paths:
      - .github/workflows/rebuild-review-binaries.yml
      - scripts/rebuild-go-binaries.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-reviewed-branch:
    if: github.repository == 'Amam8585/OmniTunnel' && github.ref == 'refs/heads/fix/apadana-full-ci-hardening-20261014'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: Rebuild Go binaries reproducibly, inspect ELF architecture
        run: bash scripts/rebuild-go-binaries.sh
      - name: Validate rebuilt outputs against a second clean compilation
        shell: bash
        run: |
          set -euo pipefail
          for module in omniackless omnistripe; do
            for arch in amd64 arm64; do
              fresh="$(mktemp)"
              ( cd "src/$module" && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "$fresh" . )
              cmp "bin/$module-$arch" "$fresh"
              rm -f "$fresh"
            done
          done
      - name: Commit Go artifacts on review branch only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bin/omniackless-amd64 bin/omniackless-arm64 bin/omnistripe-amd64 bin/omnistripe-arm64; then
            echo 'Committed artifacts already match; no changes.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bin/omniackless-amd64 bin/omniackless-arm64 bin/omnistripe-amd64 bin/omnistripe-arm64
          git commit -m 'build(go): refresh source-identical linux amd64/arm64 artifacts'
          git push origin HEAD:refs/heads/fix/apadana-full-ci-hardening-20261014
