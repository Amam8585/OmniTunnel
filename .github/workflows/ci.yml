name: CI

on:
  push:
    branches: [main, 'phase4/**', 'final/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [omniackless, omnistripe]
    defaults:
      run:
        working-directory: src/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race ./...
      - name: Offline allocation microbench and CPU/RSS profiling
        run: |
          go test -run '^$' -bench 'Benchmark(ReadFrame|TCPChecksum|DirectFlowHash)' -benchmem -count=2 ./...
          go test -run '^$' -bench 'Benchmark(ReadFrame|TCPChecksum|DirectFlowHash)' -benchtime=1s -cpuprofile=/tmp/omnitunnel-go-cpu.pprof -memprofile=/tmp/omnitunnel-go-mem.pprof ./...

  binaries:
    name: committed binaries current (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [omniackless, omnistripe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: rebuild from source and verify committed binaries are byte-identical
        run: |
          set -e
          module="${{ matrix.module }}"
          if [ "$module" = omnistripe ]; then
            markers=("$(grep -oE 'omnistripe [0-9]+\.[0-9]+\.[0-9]+' src/omnistripe/main.go | head -1)")
          else
            markers=(".sendbase." "refusing to start to avoid sequence reuse")
          fi
          for arch in amd64 arm64; do
            committed="bin/${module}-${arch}"
            fresh="$(mktemp)"
            ( cd "src/${module}" && CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -buildvcs=false -o "${fresh}" . )
            if [ ! -s "${committed}" ]; then
              echo "committed binary ${committed} is missing or empty"
              exit 1
            fi
            if ! cmp -s "${fresh}" "${committed}"; then
              echo "committed ${committed} is NOT byte-identical to a reproducible -trimpath -buildvcs=false build from source on go 1.26.3; rebuild and recommit it"
              exit 1
            fi
            for m in "${markers[@]}"; do
              if ! grep -aqF -- "${m}" "${committed}"; then
                echo "committed ${committed} lacks expected marker [${m}]"
                exit 1
              fi
            done
          done

  shell:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax, benchmark unit tests and escaped Bash command regressions
        run: |
          python3 -m py_compile scripts/monitor_legacy.py benchmarks/latency_report.py benchmarks/test_latency_report.py
          python3 -m unittest discover -s benchmarks -p 'test_*.py' -v
          python3 tests/shell_escape_regression.py
      - name: run shell tests
        run: |
          set -e
          for t in tests/*.sh; do
            [ "$t" != tests/installer_integration_test.sh ] || continue
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  direct-c:
    name: Direct C core and sanitizer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: |
          bash -n install.sh omnitunnel.sh icmptun-ctl.sh
          for s in scripts/*.sh; do bash -n "$s"; done
          for t in tests/*.sh; do bash -n "$t"; done
      - name: Build all C Direct engines
        run: |
          gcc -O2 -Wall -Wextra -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
            -o /tmp/omnitun src/main.c src/obsctun.c src/obsctcp.c \
            src/obscmux.c src/obscws.c src/icmptun.c src/monocypher.c -pthread
          /tmp/omnitun version
      - name: Sanitizer unit tests
        run: |
          gcc -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o /tmp/icmptun-core-tests tests/icmptun_core_test.c
          ASAN_OPTIONS=detect_leaks=1 /tmp/icmptun-core-tests
      - name: Fail-closed AEAD nonce source regression
        run: |
          gcc -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o /tmp/secure-nonce-test tests/secure_nonce_test.c
          ASAN_OPTIONS=detect_leaks=1 /tmp/secure-nonce-test
      - name: WebSocket RFC6455 sanitizer integration
        run: |
          gcc -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer \
            -o /tmp/ws-handshake-tests tests/ws_handshake_test.c src/monocypher.c -pthread
          ASAN_OPTIONS=detect_leaks=1 /tmp/ws-handshake-tests
      - name: Clang direct C core build
        run: |
          clang -O2 -Wall -Wextra -fsyntax-only src/icmptun.c src/obsctun.c \
            src/obsctcp.c src/obscmux.c src/obscws.c src/main.c src/monocypher.c
      - name: Runtime optimizer paths and rollback using fake iproute2
        run: |
          sudo bash tests/optimizer_runtime_test.sh
      - name: ICMP synthetic flow table benchmark (NOT end-to-end)
        run: |
          gcc -O2 -Wall -Wextra -o /tmp/icmptun-microbench tests/icmptun_microbench.c
          /tmp/icmptun-microbench
      - name: Real installer integration in isolated prefix
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sshpass netcat-openbsd
          bash tests/installer_integration_test.sh
      - name: Direct preservation and shell tests
        run: |
          for t in tests/*.sh; do
            if [ "$t" != tests/installer_integration_test.sh ]; then bash "$t"; fi
          done